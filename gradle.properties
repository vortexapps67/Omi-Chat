android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.code.style=official

# Bounded, single-JVM build.
#
# The Kotlin compiler runs inside the Gradle daemon rather than in a separate
# Kotlin daemon: this app builds fine either way, but two JVMs means two heaps
# competing for RAM, and dexing + KSP are the peak-memory steps. Keeping it to
# one process also removes the "Could not receive a message from the daemon"
# failure that shows up when the second JVM cannot get memory.
org.gradle.jvmargs=-Xmx1600m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

# The Kotlin daemon still gets a bound in case the strategy above is overridden
# from the command line, so a stray second JVM cannot balloon.
kotlin.daemon.jvmargs=-Xmx1024m