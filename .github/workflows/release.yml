name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Create local.properties from secrets
        run: |
          cat > local.properties << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}
          EOF

      - name: Create keystore.properties from secrets
        run: |
          cat > keystore.properties << EOF
          KEYSTORE_PATH=../keystore/release.keystore
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          mkdir -p keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build Universal APK (split per ABI)
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=${{ github.ref_name }}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION=${VERSION#v}
          
          # Find and rename APK
          find app/build/outputs/apk/release -name "*.apk" | while read apk; do
            new_name="omichat-${VERSION}-$(basename "$apk")"
            cp "$apk" "omichat-${VERSION}-$(basename "$apk")"
            echo "APK_PATH=$PWD/$new_name" >> $GITHUB_ENV
          done
          
          # Also copy AAB
          find app/build/outputs/bundle/release -name "*.aab" | while read aab; do
            new_name="omichat-${VERSION}-$(basename "$aab")"
            cp "$aab" "omichat-${VERSION}-$(basename "$aab")"
            echo "AAB_PATH=$PWD/$new_name" >> $GITHUB_ENV
          done

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omichat-release-apk
          path: |
            omichat-*.apk
            omichat-*.aab
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Omi Chat ${{ github.ref_name }}
          body: |
            ## Omi Chat ${{ github.ref_name }}
            
            ### Changes
            - See commit history for details
            
            ### Downloads
            - **Universal APK**: Install on any Android device (API 26+)
            - **AAB**: For Play Store submission
            
            ### Installation
            1. Download the APK file
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK
            
            ### Requirements
            - Android 8.0 (API 26) or higher
            - Internet connection for Supabase backend
          draft: false
          prerelease: false
          files: |
            omichat-*.apk
            omichat-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Manual Trigger)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Omi Chat v${{ github.event.inputs.version }}
          body: |
            ## Omi Chat v${{ github.event.inputs.version }}
            
            ### Downloads
            - **Universal APK**: Install on any Android device (API 26+)
            - **AAB**: For Play Store submission
            
            ### Installation
            1. Download the APK file
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK
          draft: false
          prerelease: false
          files: |
            omichat-*.apk
            omichat-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build debug APK for testing on PRs
  build-debug:
    name: Build Debug APK (PR Check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties from secrets
        run: |
          cat > local.properties << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omichat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Run Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon