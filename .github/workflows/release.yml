name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to stamp on the APK (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write app/.env from secrets
        run: |
          mkdir -p app
          cat > app/.env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}
          EOF

      - name: Setup Signing Keystore (With Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "KEYSTORE_PATH=keystore/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "✅ Loaded custom release keystore from secrets."
          else
            echo "⚠️ KEYSTORE_BASE64 secret not found. Generating a signing keystore for build compatibility..."
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias omichat-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=OmiChat, OU=Mobile, O=PopChat, L=City, ST=State, C=US"
            echo "KEYSTORE_PATH=keystore/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=omichat-key" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "✅ Created fallback signing keystore."
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee gradle-assembleRelease.log

      - name: Publish Gradle diagnostics
        if: always()
        run: |
          found=0
          for log in gradle-*.log; do
            [ -f "$log" ] || continue
            found=1
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 500 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = 0 ]; then
            echo 'No Gradle log was produced - the build never started.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_id }}
          path: gradle-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect APK artifacts
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            cp "$apk" "dist/omichat-${VERSION}-$(basename "$apk")"
          done
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omichat-apk-${{ env.RELEASE_VERSION }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write app/.env from secrets
        run: |
          mkdir -p app
          cat > app/.env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}
          EOF

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee gradle-lintDebug.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-testDebugUnitTest.log

      # Uploaded unconditionally so a red PR can be diagnosed from the artifact
      # alone, without needing Actions log access.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_id }}
          path: gradle-*.log
          if-no-files-found: ignore
          retention-days: 14
