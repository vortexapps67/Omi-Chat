name: Build and Release APK

on:
  # Pushes to main run a full release build so every merge is verifiable.
  #
  # No paths filter here. A paths-ignore appears harmless but is not: GitHub
  # evaluates path filters against the files a push changed, and a commit that
  # changes none - which is exactly what an empty "re-run the build" commit is -
  # matches nothing and is therefore skipped. That makes the documented way to
  # re-run after adding a secret silently do nothing.
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Pull requests get the debug build plus lint and unit tests.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to stamp on the release (e.g., 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Create a GitHub Release for this run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # No gradle-version on purpose: the committed Gradle wrapper is the single
      # source of truth for the build tool version, locally and in CI.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts resolves Supabase config from app/.env, falling back
      # to the environment. Writing the file keeps the value out of the shell
      # history in later steps.
      - name: Write app/.env from secrets
        run: |
          mkdir -p app
          cat > app/.env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}
          EOF

      # Optional: without a keystore the release APK is simply unsigned. The
      # decision is made in the shell rather than a step `if`, because step
      # conditions cannot read the secrets context reliably - getting it wrong
      # would silently skip signing instead of failing loudly.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "KEYSTORE_PATH=keystore/release.keystore" >> "$GITHUB_ENV"
            echo "Decoded release keystore"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - release APK will be unsigned"
          fi

      - name: Export signing credentials
        if: ${{ env.KEYSTORE_PATH != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      # Gradle output is teed to a file as well as the console. The console log
      # for a failed job is only visible to someone who can open Actions, and it
      # is truncated at a few thousand lines, so the same output is also written
      # to the run summary and uploaded as an artifact. pipefail is required:
      # the runner's default shell is `bash -e`, and without it the exit status
      # of a pipeline is the status of `tee`, so a failed build would look green.
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee gradle-assembleRelease.log

      - name: Build release AAB
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease --stacktrace 2>&1 | tee gradle-bundleRelease.log

      # Runs even when a build step failed, which is the whole point.
      - name: Publish Gradle diagnostics
        if: always()
        run: |
          found=0
          for log in gradle-*.log; do
            [ -f "$log" ] || continue
            found=1
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 500 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = 0 ]; then
            echo 'No Gradle log was produced - the build never started.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_id }}
          path: gradle-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect artifacts with version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            cp "$apk" "dist/omichat-${VERSION}-$(basename "$apk")"
          done
          for aab in app/build/outputs/bundle/release/*.aab; do
            [ -e "$aab" ] || continue
            cp "$aab" "dist/omichat-${VERSION}-$(basename "$aab")"
          done
          ls -l dist

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: omichat-${{ env.RELEASE_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # A GitHub Release is cut for tag pushes, or for a manual run that asked
      # for one. Plain pushes to main stop at the artifact upload.
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: softprops/action-gh-release@v2
        with:
          name: Omi Chat ${{ env.RELEASE_VERSION }}
          body: |
            ## Omi Chat ${{ env.RELEASE_VERSION }}

            ### Downloads
            - `omichat-*.apk` - universal APK, install on any Android 8.0+ device
            - `omichat-*.aab` - bundle for Play Store submission

            ### Installation
            1. Download the APK
            2. Enable "Install from unknown sources" in Android settings
            3. Install

            ### Notes
            - Backend is Supabase (auth, Postgres, realtime, storage)
            - Sign-in requires the Supabase keys baked in at build time
          fail_on_unmatched_files: true
          files: dist/omichat-*

  verify:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write app/.env from secrets
        run: |
          mkdir -p app
          cat > app/.env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL=${{ secrets.SUPABASE_JWKS_URL }}
          EOF

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee gradle-lintDebug.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-testDebugUnitTest.log

      # Uploaded unconditionally so a red PR can be diagnosed from the artifact
      # alone, without needing Actions log access.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_id }}
          path: gradle-*.log
          if-no-files-found: ignore
          retention-days: 14
